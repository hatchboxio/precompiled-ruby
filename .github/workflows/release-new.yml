name: Release New Versions

on:
  push:
    branches:
      - main
    paths:
      - recipes/rubies.yml
      - .github/workflows/release-new.yml
  workflow_dispatch:
    inputs:
      replace_all:
        description: 'Replace all existing releases'
        required: false
        type: boolean
        default: false
      only:
        description: 'Release exactly these versions, space-separated, whether or not they have a release'
        required: false
        type: string
        default: ''
  schedule:
    - cron: "30 */12 * * *"

concurrency:
  group: release-new
  cancel-in-progress: false

# actions: write lets the built-in token dispatch release.yml. A RELEASE_TOKEN secret is
# optional; set one (a PAT with contents and actions write) if you want autobump's pushes to
# trigger this workflow, which pushes made with the built-in token never do.
permissions:
  contents: write
  actions: write

env:
  # Versions this repository has a recipe for are left to mirror-upstream.yml, which copies
  # upstream's builds of them here. Set to '' to build everything from our own recipes.
  UPSTREAM_REPO: jdx/ruby

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Find versions to release
        id: find-versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          recipe_versions=$(ruby -ryaml -e 'puts YAML.load_file("recipes/rubies.yml").fetch("rubies").keys')

          # Anything upstream has a recipe for, upstream builds; mirror-upstream.yml copies it here.
          upstream_versions=""
          if [[ -n "$UPSTREAM_REPO" ]]; then
            gh api "repos/${UPSTREAM_REPO}/contents/recipes/rubies.yml" -H 'Accept: application/vnd.github.raw' > /tmp/upstream-rubies.yml
            upstream_versions=$(ruby -ryaml -e 'puts YAML.load_file("/tmp/upstream-rubies.yml").fetch("rubies").keys')
            echo "Leaving to the upstream mirror: $(echo $upstream_versions | tr '\n' ' ')"
          fi

          if [[ "${{ inputs.replace_all }}" == "true" ]]; then
            versions_to_release=""
            for version in $recipe_versions; do
              if ! echo "$upstream_versions" | grep -q "^${version}$"; then
                versions_to_release="$versions_to_release $version"
              fi
            done
            echo "Replacing all releases built here: $versions_to_release"
          else
            existing_releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' || true)
            versions_to_release=""
            for version in $recipe_versions; do
              if echo "$upstream_versions" | grep -q "^${version}$"; then
                continue
              fi
              if ! echo "$existing_releases" | grep -q "^${version}$"; then
                versions_to_release="$versions_to_release $version"
              fi
            done
            echo "Found versions without releases: $versions_to_release"
          fi

          if [[ -n "${{ inputs.only }}" ]]; then
            versions_to_release=""
            for version in ${{ inputs.only }}; do
              if echo "$recipe_versions" | grep -q "^${version}$"; then
                versions_to_release="$versions_to_release $version"
              else
                echo "No recipe for $version, skipping"
              fi
            done
            echo "Releasing only: $versions_to_release"
          fi

          versions_json=$(echo $versions_to_release | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -s -c .)
          echo "versions=$versions_json" >> "$GITHUB_OUTPUT"

          latest_stable=$(ruby -ryaml -e 'puts YAML.load_file("recipes/rubies.yml").fetch("rubies").keys.grep(/\A\d+\.\d+\.\d+\z/).sort_by { |v| v.split(".").map(&:to_i) }.last')
          echo "latest_stable=$latest_stable" >> "$GITHUB_OUTPUT"
          echo "Latest stable version: $latest_stable"

      - name: Trigger releases
        if: steps.find-versions.outputs.versions != '[]'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          versions='${{ steps.find-versions.outputs.versions }}'
          latest_stable='${{ steps.find-versions.outputs.latest_stable }}'
          for version in $(echo "$versions" | jq -r '.[]'); do
            if [[ "$version" == "$latest_stable" ]]; then
              echo "Triggering release for $version (latest)"
              gh workflow run release.yml -f version="$version" -f latest=true
            else
              echo "Triggering release for $version"
              gh workflow run release.yml -f version="$version"
            fi
            sleep 5
          done
