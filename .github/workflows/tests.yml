name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    runs-on: ubuntu-latest
    outputs:
      bundling-versions: ${{ steps.bundling.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Validate recipes
        run: bin/validate-recipes
      - name: Check Ruby syntax
        run: |
          ruby -c libexec/package.rb
          ruby -c libexec/validate_recipes.rb
          ruby -c libexec/update_ruby_recipe.rb
          ruby -c libexec/update_bundled_gems.rb
      # The newest Ruby of every series that bundles gems (not the ones with
      # `bundled_gems: ~`), compared as versions since rubies.yml is not strictly ordered.
      # A series with only prereleases counts only if it is the newest one, so a dead
      # preview series such as 3.5 is left out.
      - name: Pick a Ruby per bundling series
        id: bundling
        run: |
          versions=$(ruby -rjson -ryaml -e '
            rubies = YAML.load_file("recipes/rubies.yml").fetch("rubies")
            series = YAML.load_file("recipes/series.yml").fetch("series")
            bundling = series.keys.reject { |key| series[key]&.key?("bundled_gems") && series[key]["bundled_gems"].nil? }
            newest = bundling.max_by { |key| Gem::Version.new(key) }
            versions = bundling.filter_map do |key|
              all = rubies.select { |_, recipe| recipe["series"] == key }.keys
              stable = all.grep(/\A\d+\.\d+\.\d+\z/)
              (stable.empty? && key == newest ? all : stable).max_by { |version| Gem::Version.new(version.tr("-", ".")) }
            end
            puts JSON.generate(versions)
          ')
          echo "Bundling series builds: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  # Stays on GitHub's runners (build.yml's self_hosted defaults to false): a pull request
  # can come from anyone, and the self-hosted runners are machines at home.
  build:
    needs: syntax
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      version: 3.4.1

  # The bundled-gems workflow's PRs build the newest Ruby of every series that bundles gems:
  # 3.2 and 3.3 carry their own pins, and the defaults also reach 4.x, none of which the
  # 3.4.1 build above exercises.
  build-bundling:
    needs: syntax
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'autobump/')
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.syntax.outputs.bundling-versions) }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ matrix.version }}

  final:
    needs:
      - syntax
      - build
      - build-bundling
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: Check CI job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
