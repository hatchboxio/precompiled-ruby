name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      self_hosted:
        description: Build x86_64_linux on the self-hosted runners instead of GitHub's
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      # The self-hosted runners are x64 Ubuntu VMs at home, so only x86_64_linux can move
      # there; arm64_linux always builds on GitHub's hosted arm runner. Off by default so
      # pull requests, which anyone can open on this public repository, never run on them.
      self_hosted:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Where the bootstrap Ruby that runs bin/package inside the manylinux containers comes
  # from. Any repository with a released ruby-3.4.7.<target>.no_yjit.tar.gz will do; switch
  # this to your own once it has one.
  BOOTSTRAP_REPO: hatchboxio/precompiled-ruby
  BOOTSTRAP_VERSION: "3.4.7"

jobs:
  # What this version's series allows: old series build without a yjit variant and get a
  # smoke test their stdlib can pass. See recipes/series.yml.
  plan:
    runs-on: ubuntu-latest
    outputs:
      legacy: ${{ steps.info.outputs.legacy }}
      yjit: ${{ steps.info.outputs.yjit }}
      linux-matrix: ${{ steps.matrix.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - id: info
        run: bin/recipe-info "${{ inputs.version }}" >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          YJIT: ${{ steps.info.outputs.yjit }}
          SELF_HOSTED: ${{ inputs.self_hosted }}
        run: |
          # Both variants per target when the series has YJIT, otherwise one build per target
          # (bin/package names it without the .no_yjit suffix).
          if [[ "$YJIT" == "true" ]]; then yjits='[true, false]'; else yjits='[false]'; fi
          if [[ "$SELF_HOSTED" == "true" ]]; then x86='["self-hosted", "linux", "x64"]'; else x86='"ubuntu-22.04"'; fi
          # Each target's pinned manylinux container is resolved here so the build jobs need
          # no host Ruby: ruby/setup-ruby on self-hosted runners installs into the shared
          # /opt/hostedtoolcache, and two jobs extracting the same Ruby there at once race.
          containers=$(ruby -ryaml -rjson -e 'puts YAML.load_file("recipes/targets.yml").fetch("targets").transform_values { |t| t.fetch("container") }.to_json')
          echo "linux=$(jq -c -n --argjson yjits "$yjits" --argjson x86 "$x86" --argjson containers "$containers" '{include: [
            {runner: $x86,               target: "x86_64_linux"},
            {runner: "ubuntu-22.04-arm", target: "arm64_linux"}
          ] | map(. as $t | $yjits[] | $t + {yjit: ., container: $containers[$t.target]})}')" >> "$GITHUB_OUTPUT"

  build-linux:
    name: build-linux (${{ matrix.target }}, yjit=${{ matrix.yjit }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.linux-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build portable Ruby in manylinux
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          YJIT: ${{ matrix.yjit }}
          CONTAINER: ${{ matrix.container }}
        run: |
          set -euxo pipefail
          docker pull "$CONTAINER"
          docker run --rm \
            -e VERSION \
            -e TARGET \
            -e YJIT \
            -e BOOTSTRAP_VERSION \
            -e BOOTSTRAP_REPO \
            -v "$PWD:/work" \
            -w /work \
            "$CONTAINER" \
            /bin/bash -lc '
              set -euxo pipefail
              yum install -y curl tar gzip xz make gcc gcc-c++ perl perl-IPC-Cmd perl-Time-Piece patch file findutils diffutils which git binutils

              bootstrap_version="$BOOTSTRAP_VERSION"
              bootstrap_root=".build/bootstrap/${TARGET}-${bootstrap_version}"
              if [[ ! -x "${bootstrap_root}/bin/ruby" ]]; then
                case "$TARGET" in
                  x86_64_linux) bootstrap_platform="x86_64_linux" ;;
                  arm64_linux) bootstrap_platform="arm64_linux" ;;
                  *) echo "unknown target: $TARGET" >&2; exit 1 ;;
                esac
                bootstrap_url="https://github.com/${BOOTSTRAP_REPO}/releases/download/${bootstrap_version}/ruby-${bootstrap_version}.${bootstrap_platform}.no_yjit.tar.gz"
                rm -rf "$bootstrap_root"
                mkdir -p "$bootstrap_root"
                curl -fL --retry 3 -o /tmp/bootstrap-ruby.tar.gz "$bootstrap_url"
                tar -xzf /tmp/bootstrap-ruby.tar.gz -C "$bootstrap_root" --strip-components 1
              fi

              export PATH="${PWD}/${bootstrap_root}/bin:${PATH}"
              if [[ "$YJIT" == "true" ]]; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
                export PATH="${HOME}/.cargo/bin:${PATH}"
                export JDX_RUBY_RUSTUP_HOME="${PWD}/.build/rustup-${TARGET}"
                yjit_arg="--yjit"
              else
                yjit_arg="--no-yjit"
              fi

              bin/package "$VERSION" --target "$TARGET" "$yjit_arg" --output rubies
            '

      # The container runs as root, so everything it wrote into the workspace is root-owned.
      # On a self-hosted runner the workspace outlives the job, and the next checkout's clean
      # would fail on those files, so hand them back to the runner user even after a failed
      # build.
      - name: Fix workspace ownership
        if: always()
        env:
          CONTAINER: ${{ matrix.container }}
        run: docker run --rm -v "$PWD:/work" "$CONTAINER" chown -R "$(id -u):$(id -g)" /work

      - name: Upload portable Ruby
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruby-${{ inputs.version }}-${{ matrix.target }}-yjit-${{ matrix.yjit }}
          path: rubies/

      - name: Test portable Ruby
        env:
          LEGACY: ${{ needs.plan.outputs.legacy }}
        run: |
          mkdir -p portable-ruby
          tar --strip-components 1 -C portable-ruby -xf rubies/*.tar.gz
          export PATH="${PWD}/portable-ruby/bin:${PATH}"
          if [[ "${{ matrix.yjit }}" == "true" ]]; then
            ruby --version --yjit
          else
            ruby --version
          fi
          if [[ "$LEGACY" == "true" ]]; then
            # No reline before 2.7, no json before 1.9, and -r debug on 3.0 or older starts
            # the interactive debugger. bin/package already ran the real test suite.
            ruby -r openssl -r yaml -r zlib -r bigdecimal -e "true"
          else
            ruby -r debug -r bigdecimal -r json -r yaml -r reline -e "true"
          fi
